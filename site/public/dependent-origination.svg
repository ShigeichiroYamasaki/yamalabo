<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">単純な因果連鎖と相互依存ネットワーク</title>
  <desc id="desc">左は A から B、B から C。右は A と B、A と C、B と C をそれぞれ双方向の矢印で結ぶ。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="#23617a"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#fff"/>
  <g fill="#17435a" font-family="Hiragino Sans, Noto Sans CJK JP, sans-serif" text-anchor="middle">
    <g font-size="25" font-weight="600">
      <text x="236" y="55">単純な因果連鎖</text>
      <text x="720" y="55">相互依存ネットワーク</text>
    </g>
    <g fill="none" stroke="#23617a" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M129 179H205"/>
      <path d="M265 179H341"/>
      <g marker-start="url(#arrow)">
        <path d="M660 137H780"/>
        <path d="M647 161 703 237"/>
        <path d="M793 161 737 237"/>
      </g>
    </g>
    <g fill="#eef4f7" stroke="#23617a" stroke-width="1.8">
      <circle cx="100" cy="179" r="29"/><circle cx="236" cy="179" r="29"/><circle cx="372" cy="179" r="29"/>
      <circle cx="630" cy="137" r="29"/><circle cx="810" cy="137" r="29"/><circle cx="720" cy="260" r="29"/>
    </g>
    <g font-size="20">
      <text x="100" y="186">A</text><text x="236" y="186">B</text><text x="372" y="186">C</text>
      <text x="630" y="144">A</text><text x="810" y="144">B</text><text x="720" y="267">C</text>
    </g>
  </g>
</svg>
